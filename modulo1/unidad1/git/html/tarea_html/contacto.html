      </ul>

    <main>
      <h2>Formulario de Reserva</h2>
        <form action="#" method="post">
            <fieldset>
            <legend>Datos del pasajero</legend>

            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="fecha">Fecha de vuelo:</label><br>
            <input type="date" id="fecha" name="fecha"><br><br>

            <label for="origen">Origen:</label><br>
            <select id="origen" name="origen">
                <option value="Quito">Quito</option>
                <option value="Guayaquil">Guayaquil</option>
                <option value="Cuenca">Cuenca</option>
            </select><br><br>

            <label for="destino">Destino:</label><br>
            <select id="destino" name="destino">
                <option value="Galápagos">Galápagos</option>
                <option value="Bogotá">Bogotá</option>
                <option value="Lima">Lima</option>
            </select><br><br>

            <label>Tipo de vuelo:</label><br>
            <input type="radio" id="ida" name="tipo" value="ida" checked>
            <label for="ida">Solo ida</label>
            <input type="radio" id="idayvuelta" name="tipo" value="ida_vuelta">
            <label for="idayvuelta">Ida y vuelta</label><br><br>

            <input type="checkbox" id="equipaje" name="equipaje" value="si">
            <label for="equipaje">Agregar equipaje adicional</label><br><br>

            <label for="comentarios">Comentarios:</label><br>
            <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea><br><br>
            </fieldset>

            <button type="submit">Enviar Reserva</button>
        </form>
    </main>
     <footer>    
        <address>Av. Amazonas 123, Quito - Ecuador | Teléfono: +593 962 566 243</address>
    </footer>

</body>
</html>
