<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FlyFast - Gestión de Vuelos</title>
</head>
<body>

  <h1>Gestor de Vuelos FlyFast</h1>

  <form id="formulario">
    <input type="text" id="origen" placeholder="Origen" required>
    <input type="text" id="destino" placeholder="Destino" required>
    <input type="number" id="precio" placeholder="Precio" required>
    <input type="number" id="asientos" placeholder="Asientos disponibles" required>
    <button type="submit">Agregar Vuelo</button>
  </form>

  <section id="contenedorVuelos"></section>

  <script src="08_ventas_mp.js"></script>
</body>
</html>
